<style>

argin-bottom:20px}.search input{border:0;outline:0;flex:1;min-width:0;color:var(--ink);background:transparent;font-size:12px}.patient-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:17px}.patient-card{border:1px solid var(--line);background:white;border-radius:14px;padding:23px;text-align:left;transition:transform .15s}.patient-card:hover{transform:translateY(-2px);border-color:#b5cba7}.patient-card .avatar{width:47px;height:47px;margin-bottom:17px}.patient-card h3{font-size:15px;font-weight:600}.patient-card p{font-size:11px;color:var(--muted);margin-top:5px}.patient-card-bottom{border-top:1px solid var(--line);margin-top:19px;padding-top:13px;display:flex;justify-content:space-between;align-items:center;font-size:11px}.session-row{padding:19px 22px;border-top:1px solid var(--line);display:flex;gap:14px}.note-text{font-size:12px;line-height:1.7;color:#617167;margin-top:9px;white-space:pre-wrap;overflow-wrap:anywhere}.treatments{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.treatment-tag{font-size:10px;background:#f1f5ed;padding:4px 8px;border-radius:5px;color:#58704f}.empty{padding:35px 22px;color:var(--muted);font-size:12px;text-align:center}.modal[hidden]{display:none}.modal{position:fixed;inset:0;background:#102b2466;z-index:20;display:flex;justify-content:flex-end;backdrop-filter:blur(3px)}.sheet{background:var(--paper);width:490px;max-width:100%;height:100%;overflow:auto;box-shadow:-10px 0 80px #102b2420;animation:slide .2s ease-out}.sheet-head{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:22px 26px}.sheet-head h2{font-size:21px;letter-spacing:-.6px;font-weight:550}.sheet-body{padding:23px 26px 30px}.hint{font-size:11px;line-height:1.65;color:var(--muted);margin-bottom:23px}.field{display:block;margin-bottom:17px;font-size:11px;font-weight:600}.field input,.field select,.field textarea{display:block;width:100%;margin-top:7px;padding:11px 12px;background:white;border:1px solid #dfe5da;border-radius:8px;color:var(--ink);font-size:12px;font-weight:400}.field textarea{resize:vertical;min-height:86px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.choice-label{font-size:11px;font-weight:600;margin-bottom:9px}.choices{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}.choice{display:flex;align-items:center;font-size:11px;cursor:pointer;position:relative}.choice input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.choice span{border:1px solid #dde4d7;background:white;border-radius:7px;padding:9px 11px;pointer-events:none}.choice input:checked+span{background:#dcebd0;border-color:#aec99b;color:#244b32}.choice input:focus-visible+span{outline:2px solid #225c4b;outline-offset:2px}.error{color:#a34836;font-size:11px;margin:0 0 12px}.wide{width:100%}.muted{color:var(--muted)}.profile-summary{display:flex;gap:15px;align-items:center;background:white;border:1px solid var(--line);padding:20px;border-radius:12px;margin-bottom:22px}.profile-summary .avatar{width:52px;height:52px;font-size:15px}.profile-summary h3{font-size:17px;font-weight:550}.section-label{font-size:12px;font-weight:600;margin:24px 0 11px}.detail-note{border:1px solid var(--line);border-radius:11px;padding:16px;background:white;margin-bottom:12px}.detail-note h3{font-size:12px;font-weight:600}.detail-note .meta{margin-top:5px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#183f35;color:white;box-shadow:0 8px 30px #153e3525;border-radius:10px;padding:12px 20px;font-size:12px;opacity:0;pointer-events:none;z-index:50;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.back{display:flex;align-items:center;gap:6px;margin-bottom:16px}button:active{transform:translateY(1px)}@keyframes slide{from{transform:translateX(25px);opacity:.6}to{transform:translateX(0);opacity:1}}@media(min-width:1450px){.main{padding-left:60 <body>
<div class="app">
<aside class="sidebar"><div class="brand"><span class="mark"></span>mova</div><div class="subbrand">Physiotherapy, simplified</div><nav class="nav" aria-label="Main navigation"><button data-view="today" class="active"></button><button data-view="patients"></button><button data-view="sessions"></button></nav><div class="sidebar-bottom"><span class="demo-dot"></span>A little more room for care.<br>Demo · Sample patients<br><button class="reset" data-reset>Reset demo</button></div></aside>
<main class="main"><header class="topbar"><div class="brand"><span class="mark"></span>mova</div><div class="workspace"><strong>Mova Clinic</strong><span>/</span>Care workspace</div><div class="profile"><span class="demo-pill">Interactive demo</span><span class="avatar">PT</span><span class="profile-text">Physiotherapist<small>Your care workspace</small></span></div></header><div id="content"></div><footer class="footer"><span>Made for the moments that move people.</span><span>Demo · Fictional patients · No clinic connected · <button class="text-btn" data-reset>Reset demo</button></span></footer></main>
</div>
<div class="modal" id="modal" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" id="close-modal" aria-label="Close dialog"></button></div><div class="sheet-body" id="sheet-body"></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const paths={plus:'M12 5v14M5 12h14',arrow:'m9 5 7 7-7 7',back:'m15 5-7 7 7 7',close:'m6 6 12 12M6 18 18 6',check:'m5 12 4 4L19 6',search:'m21 21-4.5-4.5M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0',calendar:'M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8m8-7.87a4 4 0 0 1 0 7.75',note:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8ZM14 2v6h6M8 13h8m-8 4h5',home:'m3 10 9-7 9 7M5 9v11h14V9m-10 11v-7h6v7',clock:'M12 8v4l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0'};
function icon(name,size=18){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+paths[name]+'"/></svg>'}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localDay(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
const today=localDay(),previous=new Date();previous.setDate(previous.getDate()-5);const earlier=localDay(previous);
const patients=[{id:1,name:'Amelia Bennett',initials:'AB',focus:'Shoulder rehabilitation',time:'09:00',colour:'#e7edda'},{id:2,name:'Noah Williams',initials:'NW',focus:'Knee rehabilitation',time:'10:30',colour:'#f4e6d8'},{id:3,name:'Maya Patel',initials:'MP',focus:'Back mobility',time:'14:00',colour:'#e4ebef'},{id:4,name:'Oliver Chen',initials:'OC',focus:'Ankle rehabilitation',time:'15:00',colour:'#eee6f0'}];
const seed=[{id:'sample-1',patient:1,date:today,duration:45,treatments:['Therapeutic exercise','Manual therapy'],notes:'Reviewed the previous session and recorded the exercises completed. Patient reported feeling comfortable during the session.',response:'Patient reported less discomfort after the session.',next:'Review response at the next appointment.',before:'4',after:'3'},{id:'sample-2',patient:3,date:earlier,duration:30,treatments:['Mobility work'],notes:'Completed the planned mobility session. Activities and patient feedback documented.',response:'Patient tolerated the session well.',next:'Discuss how the patient felt after this session.',before:'',after:''}];
let sessions=seed.map(s=>({...s})),storageAvailable=true;
try{const stored=JSON.parse(localStorage.getItem('mova-physio-demo-v1')||'null');if(stored&&Array.isArray(stored.sessions)&&stored.sessions.every(s=>s&&patients.some(p=>p.id===s.patient)&&Array.isArray(s.treatments)&&typeof s.date==='string'))sessions=stored.sessions;}catch(e){storageAvailable=false}
let view='today',lastFocused=null,toastTimer;
const content=document.getElementById('content'),modal=document.getElementById('modal'),sheetBody=document.getElementById('sheet-body');
document.getElementById('close-modal').innerHTML=icon('close');
const navNames={today:['home','Overview'],patients:['users','Patients'],sessions:['note','Sessions']};
document.querySelectorAll('[data-view]').forEach(button=>{const [symbol,label]=navNames[button.dataset.view];button.innerHTML=icon(symbol)+'<span>'+label+'</span>';button.onclick=()=>{view=button.dataset.view;render()}});
function dateLabel(value){return new Date(value+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function patient(id){return patients.find(p=>p.id===Number(id))}
function avatar(p){return '<span class="avatar" style="background:'+p.colour+'">'+p.initials+'</span>'}
function sessionCount(id){return sessions.filter(s=>s.patient===id).length}
function hasNote(id){return sessions.some(s=>s.patient===id&&s.date===today)}
function head(title,kicker){return '<div class="pagehead"><div><p class="eyebrow">'+kicker+'</p><h1>'+title+'</h1></div><button class="btn" data-new="">'+icon('plus',16)+'New session</button></div>'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(view==='today')renderToday();else if(view==='patients')renderPatients();else renderSessions();bindActions()}
function renderToday(){const completed=patients.filter(p=>hasNote(p.id)).length;content.innerHTML=head('A little more room for care.',new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))+'<section class="hero"><div class="hero-text"><p class="eyebrow">YOUR CLINIC, IN MOTION</p><h2>Less admin.<br>More human.</h2><p>A clear space for your patients, treatments<br>and every small step forward.</p></div><svg class="hero-art" viewBox="0 0 290 210" fill="none" aria-hidden="true"><circle cx="215" cy="95" r="84" fill="#d4e1bf"/><circle cx="215" cy="95" r="58" stroke="#b3c69b"/><path d="M40 205c28-30 13-56 48-77s63 6 75-26 5-51 51-58" stroke="#597a51" stroke-width="23" stroke-linecap="round"/><path d="M96 201c24-36 6-46 43-61s63-3 75-34 3-52 40-65" stroke="#fcfdf6" stroke-width="13" stroke-linecap="round"/><circle cx="173" cy="30" r="15" fill="#f4d8b5"/><circle cx="59" cy="78" r="5" fill="#8d9f70"/></svg></section><div class="metrics">'+metric('Appointments today',patients.length,'calendar')+metric('Active patients',patients.length,'users')+metric('Sessions today',sessions.filter(s=>s.date===today).length,'note')+'</div><div class="grid"><section class="card"><div class="card-head"><h2>Today’s appointments<span class="count">'+patients.length+' appointments</span></h2><span class="meta">'+completed+' with notes</span></div>'+patients.map(p=>'<div class="appointment"><span class="time">'+p.time+'</span>'+avatar(p)+'<div class="grow"><button class="text-btn patient-name" data-patient="'+p.id+'">'+p.name+'</button><div class="meta">'+p.focus+' · 45 min</div></div><span class="tag '+(hasNote(p.id)?'saved':'planned')+'">'+(hasNote(p.id)?'Note saved':'Scheduled')+'</span><button class="icon-btn" data-new="'+p.id+'" aria-label="New session for '+p.name+'">'+icon('plus',14)+'</button></div>').join('')+'<div class="footnote">'+icon('clock',13)+'Appointments and recorded sessions are shown separately.</div></section><section class="card"><div class="card-head"><h2>Your patients</h2><button class="text-btn" id="all-patients">View all '+icon('arrow',12)+'</button></div>'+patients.map(p=>'<button class="patient-row" data-patient="'+p.id+'">'+avatar(p)+'<span class="grow"><span class="patient-name">'+p.name+'</span><span class="meta" style="display:block">'+p.focus+'</span></span>'+icon('arrow',14)+'</button>').join('')+'<div class="footnote">'+icon('check',13)+'Treatment notes, all in one place.</div></section></div>';document.getElementById('all-patients').onclick=()=>{view='patients';render()}}
function metric(label,count,symbol){return '<div class="metric"><div><small>'+label+'</small><strong>'+count+'</strong></div><span class="metric-icon">'+icon(symbol,20)+'</span></div>'}
function renderPatients(){content.innerHTML=head('People, before paperwork.','PATIENT DIRECTORY')+'<label class="search">'+icon('search',17)+'<input id="search" type="search" placeholder="Search patients by name or care focus" aria-label="Search patients"></label><div class="patient-grid" id="patient-grid"></div>';drawPatientCards('');document.getElementById('search').oninput=e=>drawPatientCards(e.target.value)}
function drawPatientCards(query){const matches=patients.filter(p=>(p.name+' '+p.focus).toLowerCase().includes(query.toLowerCase()));document.getElementById('patient-grid').innerHTML=matches.length?matches.map(p=>'<button class="patient-card" data-patient="'+p.id+'">'+avatar(p)+'<h3>'+p.name+'</h3><p>'+p.focus+'</p><div class="patient-card-bottom"><span>'+sessionCount(p.id)+' recorded session'+(sessionCount(p.id)===1?'':'s')+'</span><span>View patient '+icon('arrow',13)+'</span></div></button>').join(''):'<p class="empty">No patients match your search.</p>';bindActions()}
function renderSessions(){const sorted=[...sessions].sort((a,b)=>b.date.localeCompare(a.date));content.innerHTML=head('Every session tells a story.','TREATMENT HISTORY')+'<section class="card"><div class="card-head"><h2>Recorded sessions<span class="count">'+sessions.length+' total</span></h2></div>'+(sorted.length?sorted.map(s=>{const p=patient(s.patient);return '<div class="session-row">'+avatar(p)+'<div class="grow"><button class="text-btn patient-name" data-patient="'+p.id+'">'+p.name+'</button><div class="meta">'+dateLabel(s.date)+' · '+esc(s.duration)+' min</div><div class="treatments">'+s.treatments.map(t=>'<span class="treatment-tag">'+esc(t)+'</span>').join('')+'</div><p class="note-text">'+esc(s.notes)+'</p></div><span class="tag saved">Saved</span></div>'}).join(''):'<div class="empty">No sessions yet. Add your first treatment note.</div>')+'</section>'}
function bindActions(){document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>openForm(b.dataset.new));document.querySelectorAll('[data-patient]').forEach(b=>b.onclick=()=>openPatient(b.dataset.patient))}
function openModal(title,html){if(modal.hidden)lastFocused=document.activeElement;document.getElementById('sheet-title').textContent=title;sheetBody.innerHTML=html;modal.hidden=false;document.body.style.overflow='hidden';requestAnimationFrame(()=>document.getElementById('close-modal').focus())}
function closeModal(){modal.hidden=true;document.body.style.overflow='';if(lastFocused&&lastFocused.isConnected)lastFocused.focus()}
function openPatient(id){const p=patient(id),history=sessions.filter(s=>s.patient===p.id).sort((a,b)=>b.date.localeCompare(a.date));openModal('Patient workspace','<div class="profile-summary">'+avatar(p)+'<div><h3>'+p.name+'</h3><div class="meta">'+p.focus+'</div></div></div><button class="btn wide" id="patient-new">'+icon('plus',16)+'Add treatment session</button><h3 class="section-label">Session history <span class="muted">('+history.length+')</span></h3>'+(history.length?history.map(s=>'<article class="detail-note"><h3>'+dateLabel(s.date)+' <span class="muted">· '+esc(s.duration)+' min</span></h3><div class="treatments">'+s.treatments.map(t=>'<span class="treatment-tag">'+esc(t)+'</span>').join('')+'</div><p class="note-text">'+esc(s.notes)+'</p>'+(s.response?'<p class="note-text"><strong>Patient response</strong><br>'+esc(s.response)+'</p>':'')+((s.before!==''&&s.before!=null)||(s.after!==''&&s.after!=null)?'<p class="meta">Pain before: '+(s.before===''||s.before==null?'Not recorded':esc(s.before)+'/10')+' · After: '+(s.after===''||s.after==null?'Not recorded':esc(s.after)+'/10')+'</p>':'')+(s.next?'<p class="note-text"><strong>Next-session notes</strong><br>'+esc(s.next)+'</p>':'')+'</article>').join(''):'<div class="empty">No sessions yet. Add this patient’s first treatment note.</div>'));document.getElementById('patient-new').onclick=()=>openForm(p.id)}
function painOptions(){return '<option value="">Not recorded</option>'+Array.from({length:11},(_,i)=>'<option value="'+i+'">'+i+' / 10</option>').join('')}
function openForm(id){const selected=patient(id),treatments=['Therapeutic exercise','Manual therapy','Mobility work','Education','Other'];openModal('Record a session','<p class="hint">Record the treatment you provided and the patient’s response.<br>All patients in this demo are fictional.</p><form id="session-form"><label class="field">Patient<select name="patient" required><option value="" disabled '+(!selected?'selected':'')+'>Select a patient</option>'+patients.map(p=>'<option value="'+p.id+'" '+(selected&&selected.id===p.id?'selected':'')+'>'+p.name+'</option>').join('')+'</select></label><div class="form-row"><label class="field">Session date<input type="date" name="date" value="'+today+'" max="'+today+'" min="2000-01-01" required></label><label class="field">Duration (minutes)<input name="duration" type="number" min="1" max="240" value="45" required></label></div><fieldset style="border:0;padding:0;margin:0"><legend class="choice-label">Treatment provided · select one or more</legend><div class="choices">'+treatments.map(t=>'<label class="choice"><input type="checkbox" name="treatments" value="'+t+'"><span>'+t+'</span></label>').join('')+'</div></fieldset><label class="field">Treatment details<textarea name="notes" maxlength="2000" required placeholder="What was completed during this session?"></textarea></label><label class="field">Patient response <span class="muted">(optional)</span><textarea name="response" maxlength="1000" style="min-height:65px" placeholder="How did the patient respond?"></textarea></label><div class="form-row"><label class="field">Pain before · optional<select name="before">'+painOptions()+'</select></label><label class="field">Pain after · optional<select name="after">'+painOptions()+'</select></label></div><label class="field">Next-session notes <span class="muted">(optional)</span><textarea name="next" maxlength="1000" style="min-height:65px" placeholder="Anything to review next time?"></textarea></label><p class="error" id="form-error" role="alert"></p><button class="btn wide" type="submit">'+icon('check',16)+'Save session</button><p class="hint" style="text-align:center;margin:12px 0 0">Demo only · Use sample information.</p></form>');document.getElementById('session-form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target),types=data.getAll('treatments'),notes=String(data.get('notes')).trim();if(!types.length){document.getElementById('form-error').textContent='Select at least one treatment provided.';e.target.querySelector('[name="treatments"]').focus();return}if(!notes){document.getElementById('form-error').textContent='Add a short description of the treatment.';e.target.elements.notes.focus();return}const record={id:'session-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),patient:Number(data.get('patient')),date:String(data.get('date')),duration:Number(data.get('duration')),treatments:types,notes,response:String(data.get('response')).trim(),next:String(data.get('next')).trim(),before:String(data.get('before')),after:String(data.get('after'))};sessions.unshift(record);try{localStorage.setItem('mova-physio-demo-v1',JSON.stringify({day:today,sessions}))}catch(e){storageAvailable=false}closeModal();render();openPatient(record.patient);notify('Session saved to '+patient(record.patient).name.split(' ')[0]+'’s history.'+(storageAvailable?'':' Available until this page is refreshed.'))}}
function notify(message){const toast=document.getElementById('toast');clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),4200)}
document.getElementById('close-modal').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const list=[...modal.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled&&el.offsetParent!==null),first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.querySelectorAll('[data-reset]').forEach(button=>button.onclick=()=>{if(!confirm('Reset this demo? Sessions you added will be removed.'))return;sessions=seed.map(s=>({...s}));try{localStorage.removeItem('mova-physio-demo-v1')}catch(e){}closeModal();render();notify('Demo reset to sample sessions.')});render();
</script>
</body>
</html>
